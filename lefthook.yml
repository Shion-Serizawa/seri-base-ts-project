# Git フック。`bun install` 時の prepare で `lefthook install` が走る。
#
# 方針:
#   pre-commit  … 差分ファイルのみ。1 秒以内で終わる範囲（フォーマット + 型情報なし Lint）
#   pre-push    … リポジトリ全体。型情報つき Lint・型検査・全テスト・適応度関数
#   commit-msg  … Conventional Commits 形式のチェック
#
# 実行コマンドは `bun` と `node_modules/.bin/*` に限定している。
#
# 以前は `node` で TypeScript を直接実行していた（Node 24 のネイティブ型ストリッピング）が、
# 品質ゲートの本体を `@seri/base-tooling` に移してから使えなくなった。
# **Node は node_modules 配下の .ts を型除去できない**
# （ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING）。パッケージを import する
# スクリプトは bun で走らせるしかない。
#
# `bun` が PATH 上に無い環境ではこれらのジョブが失敗するが、失敗は push を止めるので
# 黙って素通りはしない（ゲートが 1 本だけ静かに死ぬのが最も危険な壊れ方）。
#
# 緊急時は `git commit --no-verify` / `git push --no-verify` で回避できるが、CI で必ず捕まる。

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,mjs,json,jsonc}'
      run: node_modules/.bin/oxfmt {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{ts,tsx}'
      run: node_modules/.bin/oxlint {staged_files}

    - name: supply-chain
      glob: '{package.json,bunfig.toml,mise.toml,.github/workflows/*.yml}'
      run: bun run scripts/fitness/supply-chain.ts

commit-msg:
  jobs:
    - name: conventional commits
      run: bun run scripts/git/check-commit-message.ts {1}

pre-push:
  parallel: false
  jobs:
    - name: lint (type-aware)
      run: node_modules/.bin/oxlint --type-aware

    - name: typecheck
      run: node_modules/.bin/turbo run typecheck

    - name: typecheck (scripts)
      run: node_modules/.bin/tsc --noEmit -p tsconfig.json

    # 適応度関数の実装（scripts/）自体のテストも含める。
    # `//#` はルートワークスペースのタスクを指す turbo の記法。
    #
    # MSYS2_ARG_CONV_EXCL が要るのは Windows のため。lefthook は Git for Windows の
    # sh.exe でジョブを走らせ、MSYS は `/` で始まる引数をパスとみなして変換する。
    # `//#test:scripts:coverage` が `/#test:scripts:coverage` になり、turbo が
    # 「package `/` が無い」で落ちていた（このジョブだけが pre-push で失敗し、
    # 他は全部緑なので、ゲートが 1 本通っていないことに気づきにくい）。
    - name: test with coverage
      env:
        MSYS2_ARG_CONV_EXCL: '*'
      run: node_modules/.bin/turbo run test:coverage '//#test:scripts:coverage'

    # 適応度関数のバンドルサイズ検査は dist を見るため、先にビルドする
    # （turbo のキャッシュが効くので差分が無ければ数百ミリ秒）
    - name: build
      run: node_modules/.bin/turbo run build

    - name: fitness functions
      run: bun run scripts/fitness/run.ts
